name: collect
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect.py
      - run: |
          git config user.name "collect-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet || git commit -m "update $(date -u +%F)"
          git push
